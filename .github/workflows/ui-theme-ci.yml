name: Optional UI theme validation

on:
  pull_request:
    paths:
      - "packages/ui-theme/**"
      - ".github/workflows/ui-theme-ci.yml"
  push:
    paths:
      - "packages/ui-theme/**"
      - ".github/workflows/ui-theme-ci.yml"

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ui-theme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install reviewed dev dependencies without install scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
